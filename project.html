<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Detail | Akilesh Yelchuru</title>
    <meta name="description" content="Detailed aerospace engineering project page for Akilesh Yelchuru's portfolio." />
    <link rel="stylesheet" href="typography.css" />
    <link rel="stylesheet" href="project-page.css?v=case-study-20260809" />
    <link rel="stylesheet" href="project-case-palette.css?v=gallery-20260809" />
    <link rel="stylesheet" href="project-tab-pages.css?v=tab-pages-20260809" />
</head>
<body>
    <main class="project-page-shell" data-project-page>
        <nav class="project-page-nav">
            <a href="index.html#projects">← Back to Projects</a>
            <a href="index.html#contact">Contact</a>
        </nav>

        <section class="project-page-hero">
            <div>
                <span class="project-page-kicker" data-project-kicker></span>
                <h1 data-project-title>Project</h1>
                <p data-project-summary></p>
                <div class="project-page-tags" data-project-tags></div>
            </div>
            <div class="project-page-visual" data-project-visual aria-hidden="true">
                <span></span><span></span><span></span><span></span>
            </div>
        </section>

        <section class="project-case-study" aria-label="Project case study">
            <header class="case-study-header">
                <h2 data-case-title>Project</h2>
                <span></span>
            </header>

            <div class="case-study-tabs" aria-label="Project detail pages" data-page-tabs>
                <a href="project.html?tab=summary" class="is-active" data-tab-link="summary">
                    <span>i</span>
                    Summary
                </a>
                <a href="project.html?tab=details" data-tab-link="details">
                    <span>doc</span>
                    Details
                </a>
                <a href="project.html?tab=gallery" data-tab-link="gallery">
                    <span>img</span>
                    Gallery
                </a>
                <a href="project.html?tab=tools" data-tab-link="tools">
                    <span>+</span>
                    Tools
                </a>
            </div>

            <div class="case-study-body">
                <div class="case-tab-view" data-tab-view="summary">
                    <section class="case-block" id="case-summary">
                        <span class="case-label">Timeline</span>
                        <p data-project-timeline></p>
                    </section>

                    <section class="case-block">
                        <span class="case-label">Overview</span>
                        <p data-project-overview></p>
                    </section>

                    <section class="case-block">
                        <span class="case-label">Key Accomplishments</span>
                        <ul data-project-technical></ul>
                    </section>
                </div>

                <div class="case-tab-view" data-tab-view="details" hidden>
                    <section class="case-block case-detail-panel" id="case-details">
                        <span class="case-label">Project Details</span>
                        <div class="case-copy-stack" data-project-details></div>
                    </section>

                    <section class="case-block case-bom-panel" data-bom-section>
                        <span class="case-label">Bill of Materials</span>
                        <div class="case-table-wrap">
                            <table class="case-table">
                                <thead data-project-bom-head></thead>
                                <tbody data-project-bom-body></tbody>
                            </table>
                        </div>
                    </section>

                    <section class="case-block case-data-panel" data-data-section>
                        <span class="case-label">Data & Control System</span>
                        <div class="case-copy-stack" data-project-data></div>
                    </section>
                </div>

                <div class="case-tab-view" data-tab-view="gallery" hidden>
                    <section class="case-block case-gallery-panel" id="case-gallery" data-gallery-section>
                        <span class="case-label">Gallery</span>
                        <div class="case-gallery-grid" data-project-gallery></div>
                    </section>
                </div>

                <div class="case-tab-view" data-tab-view="tools" hidden>
                    <section class="case-block" id="case-tools">
                        <span class="case-label">Skills & Tools</span>
                        <div class="case-pills" data-project-tools></div>
                    </section>

                    <section class="case-block">
                        <span class="case-label">External Links</span>
                        <div class="case-links" data-project-links></div>
                    </section>
                </div>
            </div>
        </section>
    </main>

    <script src="project-page.js?v=gallery-20260809"></script>
    <script src="project-tabs-page.js?v=no-generated-gallery-20260809"></script>
</body>
</html>
