<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" role="img" aria-labelledby="title desc">
  <title id="title">NASA Lunabotics rover CAD assembly</title>
  <desc id="desc">Isometric CAD-style rover with auger, chassis, screw drivetrain, wheels, and gridded engineering background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f5762"/>
      <stop offset="1" stop-color="#262b31"/>
