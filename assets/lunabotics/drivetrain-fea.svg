<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Blue drivetrain structural analysis render</title>
  <desc id="desc">Blue truss drivetrain frame with wheel hubs and analysis-style gradient background.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#707070"/>
      <stop offset="0.58" stop-color="#343434"/>
      <stop offset="1" stop-color="#111"/>
